version: "3.9"

services:
  auth-service:
    container_name: auth-service
    image: qb1tycinema/auth-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    expose:
      - "9101"
    volumes:
      - ../docker/logs/auth:/var/log/services/auth
    networks:
      - qb1tycinema

networks:
  qb1tycinema:
    external: true